---
- name: Ensure Kibana package
  ansible.builtin.include_role:
    name: elastic_package
  vars:
    elastic_product: kibana
- name: Install Elasticsearch CA
  ansible.builtin.copy:
    src: /home/otus/dz07/certs/ca.crt
    dest: /etc/kibana/ca.crt
    remote_src: true
    mode: '0644'
  notify: Restart Kibana
- name: Install private Kibana configuration
  ansible.builtin.template:
    src: kibana.yml.j2
    dest: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: '0640'
  no_log: true
  notify: Restart Kibana
- name: Start Kibana
  ansible.builtin.systemd_service:
    name: kibana
    enabled: true
    state: started
