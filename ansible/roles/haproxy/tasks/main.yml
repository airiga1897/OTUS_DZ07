- name: Install HAProxy
  ansible.builtin.apt:
    name: [haproxy, rsyslog]
    state: present
    policy_rc_d: 101
- name: Persist HAProxy log routing
  ansible.builtin.copy:
    dest: /etc/rsyslog.d/49-otus-haproxy.conf
    content: "local0.* /var/log/haproxy.log\n& stop\n"
    mode: '0644'
  register: haproxy_log_route
- name: Enable HAProxy log receiver
  ansible.builtin.systemd_service:
    name: rsyslog
    enabled: true
    state: "{{ 'restarted' if haproxy_log_route.changed else 'started' }}"
- name: Install validated routing configuration
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
    validate: haproxy -c -f %s
  notify: Reload HAProxy
- name: Enable and start HAProxy
  ansible.builtin.systemd_service:
    name: haproxy
    state: started
    enabled: true
